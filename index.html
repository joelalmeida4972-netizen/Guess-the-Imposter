    function GuessTheImposter() {
      // Naturally opens in dark theme
      const [theme, setTheme] = React.useState('dark');
      const [screen, setScreen] = React.useState('home');
      const [playerCount, setPlayerCount] = React.useState(5);
      const [playerNames, setPlayerNames] = React.useState(Array(5).fill(''));
      const [imposterCount, setImposterCount] = React.useState(1);
      
      const [gameState, setGameState] = React.useState(null);
      const [revealStep, setRevealStep] = React.useState(0);
      const [shuffledOrder, setShuffledOrder] = React.useState([]);
      const [startingSpeakerIndex, setStartingSpeakerIndex] = React.useState(null);
      
      const [selectedImposters, setSelectedImposters] = React.useState([]);
      const [imposterGuess, setImposterGuess] = React.useState('');
      const [imposterGuessResult, setImposterGuessResult] = React.useState(null);

      const themes = {
        dark: {
          bg: '#121212',
          text: '#ffffff',
          secondary: '#a0a0a0',
          card: '#1e1e1e',
          accent: '#e63946',
          success: '#2a9d8f',
          border: '#2e2e2e',
          buttonBg: '#1e1e1e',
          logoPlate: 'radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(26,26,28,0.95) 75%)',
          logoGlow: '0 10px 32px rgba(230, 57, 70, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.12)'
        },
        light: {
          bg: '#ffffff',
          text: '#121212',
          secondary: '#666666',
          card: '#f8f9fa',
          accent: '#e63946',
          success: '#2a9d8f',
          border: '#e2e8f0',
          buttonBg: '#f1f5f9',
          logoPlate: '#ffffff',
          logoGlow: '0 8px 30px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.06)'
        }
      };

      const currentTheme = themes[theme];

      const handlePlayerCountChange = (num) => {
        setPlayerCount(num);
        setPlayerNames(prev => {
          if (prev.length === num) return prev;
          if (prev.length < num) {
            return [...prev, ...Array(num - prev.length).fill('')];
          }
          return prev.slice(0, num);
        });
        const maxAllowed = Math.max(1, Math.min(10, num - 2));
        if (imposterCount > maxAllowed) {
          setImposterCount(maxAllowed);
        }
      };

      const handlePlayerNameChange = (idx, value) => {
        setPlayerNames(prev => {
          const next = [...prev];
          next[idx] = value;
          return next;
        });
      };

      const getRandomItem = () => WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];

      const getRandomImposters = (count) => {
        const indices = Array.from({ length: playerCount }, (_, i) => i);
        const selected = [];
        for (let i = 0; i < count; i++) {
          const randomIdx = Math.floor(Math.random() * indices.length);
          selected.push(indices[randomIdx]);
          indices.splice(randomIdx, 1);
        }
        return selected;
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const startGame = () => {
        const item = getRandomItem();
        const imposters = getRandomImposters(imposterCount);
        const order = shuffleArray(Array.from({ length: playerCount }, (_, i) => i));
        const randomSpeaker = Math.floor(Math.random() * playerCount);
        
        setGameState({
          word: item.word,
          hint: item.hint,
          imposters,
          revealedIndices: new Set(),
          currentPhase: 'reveal',
          votes: []
        });
        
        setShuffledOrder(order);
        setRevealStep(0);
        setStartingSpeakerIndex(randomSpeaker);
        setSelectedImposters([]);
        setImposterGuess('');
        setImposterGuessResult(null);
        setScreen('roleReveal');
      };

      const canContinueNames = () => {
        const nonEmpty = playerNames.filter(n => n && n.trim()).length === playerCount;
        const unique = new Set(playerNames.map(n => (n || '').trim().toLowerCase())).size === playerCount;
        return nonEmpty && unique && playerCount >= 3;
      };

      const maxImpostersAllowed = Math.max(1, Math.min(10, playerCount - 2));

      const handleBackNavigation = () => {
        if (screen === 'howToPlay' || screen === 'playerCount') {
          setScreen('home');
        } else if (screen === 'playerNames') {
          setScreen('playerCount');
        } else if (screen === 'imposterCount') {
          setScreen('playerNames');
        } else if (screen === 'roleReveal') {
          if (!gameState) {
            setScreen('home');
            return;
          }
          if (gameState.currentPhase === 'reveal') {
            if (revealStep > 0) {
              setRevealStep(revealStep - 1);
            } else {
              setScreen('imposterCount');
            }
          } else if (gameState.currentPhase === 'hints') {
            setGameState({ ...gameState, currentPhase: 'reveal' });
            setRevealStep(playerCount - 1);
          } else if (gameState.currentPhase === 'voting') {
            setGameState({ ...gameState, currentPhase: 'hints' });
          } else if (gameState.currentPhase === 'results') {
            if (imposterGuessResult !== null) {
              setImposterGuessResult(null);
            } else {
              setGameState({ ...gameState, currentPhase: 'voting' });
            }
          }
        }
      };

      return (
        <div style={{
          backgroundColor: currentTheme.bg,
          color: currentTheme.text,
          minHeight: '100vh',
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          transition: 'background-color 0.2s ease, color 0.2s ease'
        }}>
          {/* Top Bar with Back Button and Theme Switcher */}
          <div style={{
            padding: '16px 20px',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center'
          }}>
            <div>
              {screen !== 'home' ? (
                <button
                  onClick={handleBackNavigation}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '6px',
                    padding: '8px 14px',
                    fontSize: '14px',
                    fontWeight: 'bold',
                    backgroundColor: currentTheme.buttonBg,
                    color: currentTheme.text,
                    border: `1px solid ${currentTheme.border}`,

                        color: 'white',
                        border: 'none',
                        borderRadius: '10px',
                        cursor: 'pointer',
                        display: 'block',
                        margin: '0 auto'
                      }}
                    >
                      SUBMIT GUESS
                    </button>
                  </div>
                );
              }
            }

            return (
              <div style={{ textAlign: 'center', padding: '30px 20px', maxWidth: '500px', margin: '0 auto' }}>
                <h2 style={{ color: currentTheme.accent, marginBottom: '20px', fontSize: '26px' }}>
                  {imposterCount === 1 ? 'THE IMPOSTER WAS...' : 'THE IMPOSTERS WERE...'}
                </h2>
                
                <div style={{
                  backgroundColor: currentTheme.card,
                  padding: '24px',
                  borderRadius: '12px',
                  marginBottom: '20px',
                  border: `1.5px solid ${currentTheme.border}`
                }}>
                  <h3 style={{ color: currentTheme.accent, fontSize: '32px', margin: 0, fontWeight: '900' }}>
                    {imposterNames.join(' & ')}
                  </h3>
                </div>
                
                <p style={{ color: currentTheme.secondary, marginBottom: '10px', fontSize: '14px' }}>THE WORD WAS</p>
                
                <div style={{
                  backgroundColor: currentTheme.card,
                  padding: '24px',
                  borderRadius: '12px',
                  marginBottom: '25px',
                  border: `1.5px solid ${currentTheme.border}`
                }}>
                  <h3 style={{ color: currentTheme.success, fontSize: '36px', margin: 0, fontWeight: '900' }}>
                    {gameState.word}
                  </h3>
                </div>
                
                <h2 style={{ color: allCorrect ? currentTheme.success : currentTheme.accent, fontSize: '34px', marginBottom: '25px', fontWeight: '900' }}>
                  {allCorrect ? 'PLAYERS WIN! 🎉' : 'IMPOSTER WINS! 😈'}
                </h2>
                
                <button
                  onClick={startGame}
                  style={{
                    width: '100%',
                    maxWidth: '300px',
                    padding: '15px',
                    fontSize: '16px',
                    fontWeight: 'bold',
                    backgroundColor: currentTheme.accent,
                    color: 'white',
                    border: 'none',
                    borderRadius: '10px',
                    cursor: 'pointer',
                    marginBottom: '12px'
                  }}
                >
                  PLAY AGAIN
                </button>
                
                <button
                  onClick={() => {
                    setGameState(null);
                    setScreen('playerCount');
                  }}
                  style={{
                    width: '100%',
                    maxWidth: '300px',
                    padding: '14px',
                    fontSize: '16px',
                    fontWeight: '600',
                    backgroundColor: currentTheme.card,
                    color: currentTheme.text,
                    border: `1.5px solid ${currentTheme.border}`,
                    borderRadius: '10px',
                    cursor: 'pointer',
                    marginBottom: '12px',
                    display: 'block',
                    margin: '0 auto 12px auto'
                  }}
                >
                  NEW SETUP
                </button>
                
                <button
                  onClick={() => {
                    setGameState(null);
                    setScreen('home');
                  }}
                  style={{
                    width: '100%',
                    maxWidth: '300px',
                    padding: '14px',
                    fontSize: '16px',
                    fontWeight: '600',
                    backgroundColor: currentTheme.card,
                    color: currentTheme.text,
                    border: `1.5px solid ${currentTheme.border}`,
                    borderRadius: '10px',
                    cursor: 'pointer',
                    display: 'block',
                    margin: '0 auto'
                  }}
                >
                  HOME
                </button>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GuessTheImposter />);
  </script>
</body>
</html>
